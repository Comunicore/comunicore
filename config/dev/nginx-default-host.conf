server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    error_page 404 /404.html;

    location / {
            try_files $uri $uri/ =404;
    }

    # Страница поста собирается одна — заглушка /posts/_/ (см. post-route.ts),
    # id берётся из URL на клиенте. index.txt — RSC-данные для клиентских
    # переходов: без них Next перезагружает страницу целиком.
    location ~ ^/posts/\d+/$ {
            try_files $uri /posts/_/index.html;
    }

    location ~ ^/posts/\d+/index\.txt$ {
            try_files $uri /posts/_/index.txt;
    }

    # RSC-запрос на несуществующую страницу: отдаём данные 404-заглушки /_/
    # (см. app/(main)/[...slug]) со статусом 200, чтобы переход остался
    # клиентским и хедер не перемонтировался. Прямой заход по-прежнему
    # получает 404.html. Правило должно идти после правил выше: nginx берёт
    # первый подошедший regex-location.
    location ~ /index\.txt$ {
            try_files $uri /_/index.txt;
    }

    location /api {
        proxy_pass http://[::1]:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
