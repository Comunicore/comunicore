openapi: '3.1.2'
info:
  title: Comunicore API
  description: API for analyzing interactions in a forum.
  contact:
    name: API Support
    email: alex19srv@gmail.com
  version: '1.0'
servers:
  - url: https://comunicore.mooo.com/
paths:
  /api/user:
    post:
      operationId: userCreate
      summary: Create a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        "400":
          description: Bad request error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorNotUnique'
                  - $ref: '#/components/schemas/ErrorStringMessage'
        "500":
          $ref: '#/components/responses/ErrorStringDescription'
  /api/user/me:
    get:
      operationId: userMe
      summary: Get current user information
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        "401":
          description: client must be authenticated to get his own data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        "500":
          $ref: '#/components/responses/ErrorStringDescription'
  /api/user/{userId}:
    parameters:
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
    get:
      operationId: userGet
      summary: Get user information
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        "401":
          description: client must be authenticated to get user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        "403":
          description: client can get only his own data, so if userId in path is not equal to id from token - 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        "500":
          description: UserNotFound or Internal Server Error
    post:
      operationId: userUpdate
      summary: Update user information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
    delete:
      operationId: userDelete
      summary: Delete a user
      responses:
        '204':
          description: No Content
  /api/auth/login:
    post:
      operationId: authLogin
      summary: User login
      description: |
        Create access and refresh JWT tokens, send to user. The refresh token also stored in a cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: JWT token for authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '400':
          description: Bad request error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorStringMessage'
        '401':
          description: incorrect login or password or login not exists
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorStringMessage'
        '500':
          $ref: '#/components/responses/ErrorStringDescription'
  /api/auth/logout:
    post:
      operationId: authLogout
      summary: User logout
      responses:
        '204':
          description: No Content
  /api/categories:
    get:
      operationId: categoriesList
      summary: Get list of all categories
      description: Get list of all categories.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesListResponse'
        "500":
          $ref: '#/components/responses/ErrorStringDescription'
  /api/posts:
    get:
      operationId: postsList
      summary: Get list of posts with pagination
      description: |
        Получить список постов с пагинацией. Можно использовать либо постраничную пагинацию (page + limit),
        либо курсорную пагинацию (after или before). Нужно использовать только один параметр.
        after, before или page с номером страницы. Если ни один не указан - выводятся самые свежие сообщения.
        limit - количество сообщений на страницу, по умолчанию 20.
        С разделением на страницы есть неприятная особенность. При удалении или добавлении новых сообщений,
        страницы могут "прыгать". Т.е. у нас есть список (сообщений) и в него могут добавляться и удаляться элементы
        в любом месте списка. Если мы находится на странице 3 и хотим 7-ю, то в ней могут быть совсем другие элементы,
        чем на момент запроса страницы 3. Поэтому для более стабильной пагинации можно использовать курсорную пагинацию.

        Навигация по номеру страницы выберает все сообщения на момент запроса и отдает нужную страницу. Добавление
        или удаление сообщений сбивает это разделение.

        Курсорная пагинация позволяет двигаться вперед и назад по списку, учитывая изменеия в нем.
        Но для нее нужно указывать минимальный или максимальный id сообщения на странице, чтобы понять откуда двигаться
        дальше. И она не позволяет прыгать на конкретную страницу, а только двигаться вперед и назад.
        При этом before и after не включаются в результат, т.е. если указать before=10, то в результат не попадет
        сообщение с id 10, а только с id меньше 10. И аналогично для after. В них указываются id сообщения, но
        before - для получения более старых сообщений, а after - для получения более новых сообщений по времени.
        Более старым сообщениям (before) соответствует меньший id (более старые сообщения),
        а более новым (after) - больший id. И при этом не важно, удалены эти сообщения или нет.
      security: []
      parameters:
        - name: limit
          in: query
          description: Number of posts to return
          required: false
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          description: Page number (starting from 1)
          required: false
          schema:
            type: integer
            default: 1
        - name: after
          in: query
          description: Return posts created after this id (for cursor pagination)
          required: false
          schema:
            type: integer
        - name: before
          in: query
          description: Return posts created before this id (for cursor pagination)
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        "401":
          description: client must be authenticated to get posts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        "500":
          $ref: '#/components/responses/ErrorStringDescription'
    post:
      operationId: postCreate
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostItem'
        "401":
          $ref: '#/components/responses/ErrorStringDescription'
        "500":
          $ref: '#/components/responses/ErrorStringDescription'
  /api/posts/{postId}:
    get:
      operationId: postGet
      summary: Get single post with all comments by post id
      security: []
      parameters:
        - name: postId
          in: path
          description: Post id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostWithCommentsListResponse'
        "400":
          $ref: '#/components/responses/ErrorStringDescription'
        "500":
          $ref: '#/components/responses/ErrorStringDescription'
  /api/posts/{postId}/comments:
    post:
      operationId: postAddComment
      summary: Add a new comment to post
      parameters:
        - name: postId
          in: path
          description: Post id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateCommentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCommentItem'
        "400":
          $ref: '#/components/responses/ErrorStringDescription'
        "500":
          $ref: '#/components/responses/ErrorStringDescription'
  /api/analytics/visit-batch:
    post:
      operationId: analyticsVisitBatchSubmit
      summary: Submit a client-side analytics batch (durations, device, activity hints)
      description: |
        Public endpoint; when the `sid` cookie is present, the batch is linked to the user.
        Idempotent per `clientBatchId`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsVisitBatchRequest'
      responses:
        '204':
          description: Accepted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        '500':
          $ref: '#/components/responses/ErrorStringDescription'
  /api/analytics/metrics:
    get:
      operationId: analyticsMetricsGet
      summary: Aggregated analytics (requires login)
      parameters:
        - name: dropoffAfterMessages
          in: query
          description: N in “churn after N posts” (users with at least N posts and inactive since)
          required: false
          schema:
            type: integer
            default: 5
            minimum: 1
        - name: dropoffInactiveDays
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsMetricsResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        '500':
          $ref: '#/components/responses/ErrorStringDescription'
  /api/media:
    post:
      summary: Upload media file
      operationId: mediaUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
      responses:
        '200':
          description: Uploaded file URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        "401":
          description: Client is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
  /storage/media/{fileName}:
    get:
      summary: Get media file by name
      operationId: mediaGet
      security: []
      parameters:
        - name: fileName
          in: path
          description: File name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        "401":
          description: Client is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStringMessage'
        "500":
          $ref: '#/components/responses/ErrorStringDescription'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
  responses:
    ErrorStringDescription:
      description: Error in request with string description (for log, not for user).
      content:
        application/json:
          schema:
            type: string
  schemas:
    UserCreateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
      required:
        - name
        - email
        - password
      example:
        name: "john_doe"
        email: "john.doe@example.com"
        password: "securepassword123"
    UserGetResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
      required:
        - id
        - name
        - email
      example:
        id: 1
        name: "john_doe"
        email: "test@mail.ru"
    UserCreateResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          format: uri
        rank:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - displayName
        - email
        - rank
      example:
        id: 1
        name: "john_doe"
        displayName: "John Doe"
        email: "test@mail.ru"
        rank: 5
        avatarUrl: "https://comunicore.mooo.com/storage/media/avatar1.png"
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - name
        - email
        - password
      example:
        name: "john_doe"
        email: "john.doe@example.com"
        password: "securepassword123"
    AuthLoginRequest:
      type: object
      properties:
        login:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - login
        - password
      example:
        login: "john.doe@example.com"
        password: "securepassword123"
    PostListResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostListItem'
        totalCountEstimated:
          type: integer
        havePrev:
          type: boolean
        haveNext:
          type: boolean
      required:
        - posts
        - totalCountEstimated
        - havePrev
        - haveNext
      example:
        posts:
          - id: 1
            title: "First post"
            content: "This is the content of the first post."
            authorId: 42
            authorName: "Petr Semenov"
            postsCount: 5
            createdAt: "2024-01-01T12:00:00Z"
          - id: 2
            title: "Second post"
            content: "This is the content of the second post."
            authorId: 43
            authorName: "Anna Ivanova"
            postsCount: 3
            createdAt: "2024-01-02T15:30:00Z"
        totalCountEstimated: 100
        havePrev: false
        haveNext: true
    PostItem:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/MessageAuthor'
        category:
          type: string
        title:
          type: string
        contentMd:
          type: string
          description: Post content in Markdown format.
        type:
          type: string
          description: Type of post ("Обсуждение", "Вопрос" или "Гайд")
        tags:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: string
            format: uri
        postStats:
          $ref: '#/components/schemas/PostStats'
        seoMeta:
          $ref: '#/components/schemas/SeoMeta'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - uuid
        - author
        - category
        - title
        - contentMd
        - type
        - postsCount
        - postStats
        - createdAt
      example:
        id: 1
        uuid: "123e4567-e89b-12d3-a456-426614174000"
        category: "Программирование"
        title: "First post"
        contentMd: "This is the content of the first post."
        type: "Обсуждение"
        author:
          id: 42
          username: "booblick"
          displayName: "Petr Semenov"
          avatarUrl: "https://comunicore.mooo.com/storage/media/avatar1.png"
          rank: 5
        postsCount: 5
        postStats:
          commentsCount: 5
          likesCount: 10
          viewsCount: 100
        files:
          - "https://comunicore.mooo.com/storage/media/file1.png"
          - "https://comunicore.mooo.com/storage/media/file2.png"
        createdAt: "2024-01-01T12:00:00Z"
    SeoMeta:
      type: object
      properties:
        description:
          type: string
        ogImageUrl:
          type: string
          format: uri
        keywords:
          type: array
          items:
            type: string
      required: []
      example:
        description: "This is the content of the first post."
        ogImageUrl: "https://comunicore.mooo.com/storage/media/og-image1.png"
        keywords: ["C++", "JavaScript", "современный Rust", "тормознутый Python"]
    PostStats:
      type: object
      properties:
        commentsCount:
          type: integer
          description: Number of comments (rows in comments). The opening message lives in title/content only and is not counted.
        likesCount:
          type: integer
          description: Number of likes for the post.
        viewsCount:
          type: integer
          description: Number of views for the post.
      required:
        - commentsCount
        - likesCount
        - viewsCount
      example:
        commentsCount: 5
        likesCount: 10
        viewsCount: 100
    CategoriesListResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string
        required:
          - id
          - name
        example:
          id: 1
          name: "Программирование"
    PostListItem:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/MessageAuthor'
        category:
          type: string
        title:
          type: string
        type:
          type: string
          description: Type of post ("Обсуждение", "Вопрос" или "Гайд")
        tags:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: string
            format: uri
        postStats:
          $ref: '#/components/schemas/PostStats'
        seoMeta:
          $ref: '#/components/schemas/SeoMeta'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - uuid
        - author
        - category
        - title
        - type
        - postStats
        - createdAt
      example:
        id: 1
        uuid: "123e4567-e89b-12d3-a456-426614174000"
        title: "First post"
        category: "Программирование"
        type: "Обсуждение"
        author:
          id: 42
          username: "booblick"
          displayName: "Petr Semenov"
          avatarUrl: "https://comunicore.mooo.com/storage/media/avatar1.png"
          rank: 5
        tags:
          - "C++"
          - "JavaScript"
          - "современный Rust"
          - "тормознутый Python"
        files:
          - "https://comunicore.mooo.com/storage/media/file1.png"
          - "https://comunicore.mooo.com/storage/media/file2.png"
        postStats:
          commentsCount: 5
          likesCount: 10
          viewsCount: 100
        createdAt: "2024-01-01T12:00:00Z"
    PostWithCommentsListResponse:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        category:
          type: string
        author:
          $ref: '#/components/schemas/MessageAuthor'
        title:
          type: string
        contentMd:
          type: string
          description: Number of reply posts (rows in posts). The opening message is not included.
        type:
          type: string
          description: Type of post ("Обсуждение", "Вопрос" или "Гайд")
        tags:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: string
            format: uri
        postStats:
          $ref: '#/components/schemas/PostStats'
        seoMeta:
          $ref: '#/components/schemas/SeoMeta'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: '#/components/schemas/PostCommentItem'
      required:
        - id
        - uuid
        - category
        - author
        - title
        - contentMd
        - type
        - postStats
        - createdAt
        - comments
      example:
        id: 1
        uuid: "123e4567-e89b-12d3-a456-426614174000"
        category: "Программирование"
        title: "First post"
        contentMd: "This is the content of the first post."
        type: "Обсуждение"
        author:
          id: 42
          username: "booblick"
          displayName: "Petr Semenov"
          avatarUrl: "https://comunicore.mooo.com/storage/media/avatar1.png"
          rank: 5
        createdAt: "2024-01-01T12:00:00Z"
        postStats:
          commentsCount: 5
          likesCount: 10
          viewsCount: 100
        comments:
          - id: 1
            contentMd: "This is the content of the first post."
            author:
              id: 42
              username: "booblick"
              displayName: "Petr Semenov"
              avatarUrl: "https://comunicore.mooo.com/storage/media/avatar1.png"
              rank: 5
            authorAvatarUrl: "https://comunicore.mooo.com/storage/media/avatar1.png"
            createdAt: "2024-01-01T12:00:00Z"
          - id: 2
            contentMd: "This is the content of the second post."
            author:
              id: 43
              username: "annai"
              displayName: "Anna Ivanova"
              avatarUrl: "https://comunicore.mooo.com/storage/media/avatar2.png"
              rank: 3
            authorAvatarUrl: "https://comunicore.mooo.com/storage/media/avatar2.png"
            createdAt: "2024-01-02T15:30:00Z"
            updatedAt: "2024-01-02T15:31:25Z"
    MessageAuthor:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        rank:
          type: number
      required:
        - id
        - username
        - displayName
        - rank
      example:
        id: 42
        username: "booblick"
        displayName: "Petr Semenov"
        avatarUrl: "https://comunicore.mooo.com/storage/media/avatar1.png"
        rank: 5
    PostCommentItem:
      type: object
      properties:
        id:
          type: integer
        parentCommentId:
          type: integer
          description: Optional parent comment id for nested comments (0 - no parent)
        author:
          $ref: '#/components/schemas/MessageAuthor'
        contentMd:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - author
        - contentMd
        - createdAt
      example:
        id: 1
        contentMd: "Первый ответ в ветке."
        author:
          id: 42
          username: "booblick"
          displayName: "Petr Semenov"
          avatarUrl: "https://comunicore.mooo.com/storage/media/avatar1.png"
          rank: 5
        authorName: "Petr Semenov"
        authorAvatarUrl: "https://comunicore.mooo.com/storage/media/avatar1.png"
        createdAt: "2024-01-01T12:00:00Z"
    PostCreateRequest:
      type: object
      properties:
        category:
          type: string
        title:
          type: string
        type:
          type: string
          enum:
            - "Обсуждение"
            - "Вопрос"
            - "Гайд"
          description: Type of post ("Обсуждение", "Вопрос" или "Гайд")
        contentMd:
          type: string
        tags:
          type: array
          items:
            type: string
          description: Optional tags for analytics (normalized to lowercase on server)
        files:
          type: array
          items:
            type: string
            format: uri
          description: Optional list of file URLs (uploaded via /api/media) to attach to the post
      required:
        - category
        - title
        - type
        - contentMd
      example:
        category: "Программирование"
        title: "How to learn Go?"
        type: "Обсуждение"
        contentMd: "I want to learn Go, but I don't know where to start. Any advice?"
        files:
          - "https://comunicore.mooo.com/storage/media/file1.png"
          - "https://comunicore.mooo.com/storage/media/file2.png"
    PostCreateCommentRequest:
      type: object
      properties:
        contentMd:
          type: string
        parentCommentId:
          type: integer
          description: Optional parent comment id for nested comments
      required:
        - contentMd
      example:
        contentMd: "I want to learn Go, but I don't know where to start. Any advice?"
    # media (files)
    MediaUploadRequest:
      type: object
      properties:
        content:
          type: string
          format: binary
      required: [ content ]
      example:
        content: (binary file content)
    MediaUploadResponse:
      type: object
      properties:
        fileName:
          type: string
        url:
          type: string
          format: uri
      required: [url, fileName]
    AnalyticsVisitBatchRequest:
      type: object
      required:
        - clientBatchId
        - activeDurationMs
        - visibleDurationMs
        - isMobile
        - batchStartAt
        - batchEndAt
      properties:
        clientBatchId:
          type: string
          format: uuid
        activeDurationMs:
          type: integer
          format: int64
          minimum: 0
        visibleDurationMs:
          type: integer
          format: int64
          minimum: 0
        isMobile:
          type: boolean
        hadComposeActivity:
          type: boolean
          description: User composed text or submitted content during this batch
        hadReadActivity:
          type: boolean
          description: User was reading/browsing (default true if omitted)
        batchStartAt:
          type: string
          format: date-time
        batchEndAt:
          type: string
          format: date-time
    AnalyticsHourBucket:
      type: object
      required:
        - hour
        - sharePercent
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        sharePercent:
          type: number
          format: double
    AnalyticsTopTag:
      type: object
      required:
        - tag
        - usageCount
      properties:
        tag:
          type: string
        usageCount:
          type: integer
          format: int64
    AnalyticsTopPost:
      type: object
      required:
        - postId
        - title
        - repliesInWindow
      properties:
        postId:
          type: integer
        title:
          type: string
        repliesInWindow:
          type: integer
          format: int64
          description: Number of reply posts in the selected time window
    AnalyticsUserCount:
      type: object
      required:
        - userId
        - name
        - count
      properties:
        userId:
          type: integer
        name:
          type: string
        count:
          type: integer
          format: int64
    AnalyticsTagCount:
      type: object
      required:
        - tag
        - postsCount
      properties:
        tag:
          type: string
        postsCount:
          type: integer
          format: int64
    AnalyticsDayPosts:
      type: object
      required:
        - day
        - postsCount
      properties:
        day:
          type: string
          format: date
        postsCount:
          type: integer
          format: int64
    AnalyticsMetricsResponse:
      type: object
      required:
        - avgActiveTimeMs
        - avgVisibleTimeMs
        - maxActiveTimeMs
        - connectionDensity
        - dropoffChurnPercent
        - dropoffAfterMessages
        - dropoffInactiveDays
        - mobilePctReaders
        - mobilePctWriters
        - mobilePctSessions
        - mobilePctUsers
        - activityByHourUtc
        - topUsersByPosts
        - popularTags
        - postsActivityByDay
        - topUsersByComments
        - postOnlyUsers
      properties:
        avgActiveTimeMs:
          type: number
          format: double
          description: Mean active (focused tab) duration per batch, ms
        avgVisibleTimeMs:
          type: number
          format: double
          description: Mean tab visible duration per batch, ms
        maxActiveTimeMs:
          type: integer
          format: int64
        connectionDensity:
          type: number
          format: double
          description: Total replies divided by distinct participants (comments + posts authors)
        dropoffChurnPercent:
          type: number
          format: double
          description: Share of users with ≥N posts inactive for dropoffInactiveDays
        dropoffAfterMessages:
          type: integer
        dropoffInactiveDays:
          type: integer
        mobilePctReaders:
          type: number
          format: double
        mobilePctWriters:
          type: number
          format: double
        mobilePctSessions:
          type: number
          format: double
        mobilePctUsers:
          type: number
          format: double
          description: Share of logged-in users (in batches) with any mobile session
        activityByHourUtc:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsHourBucket'
        topTag:
          $ref: '#/components/schemas/AnalyticsTopTag'
        topPostWeekly:
          $ref: '#/components/schemas/AnalyticsTopPost'
        topPostMonthly:
          $ref: '#/components/schemas/AnalyticsTopPost'
        topUsersByComments:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsUserCount'
          description: Top-10 users ranked by total comments count
        popularTags:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsTagCount'
          description: Tags ranked by number of tagged posts
        postsActivityByDay:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDayPosts'
          description: Daily posts count time series
        topUsersByPosts:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsUserCount'
          description: Users ranked by total created posts
        postOnlyUsers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsUserCount'
          description: Users with posts but without created posts
    # errors
    ErrorStringMessage:
      description: |
        Error with just string message, without code or other data. For simple errors,
        when we don't need to send any additional data, just a message for log.
      type: object
      properties:
        code:
          type: string
          enum: ["ErrorStringMessage"]
          example: "ErrorStringMessage"
        message:
          type: string
      example:
        message: "Some error description for log"
      required:
        - code
        - message
    ErrorNotUnique:
      description: Error in some of listed parameters, one or more is not unique.
      type: object
      properties:
        code:
          type: string
          enum: ["ErrorNotUnique"]
          example: "ErrorNotUnique"
        data:
          type: array
          items:
            type: string
          example:
            - "email"
            - "name"
      required:
        - code
        - params
security:
  - cookieAuth: []
