name: CI Checks without Deployment
permissions:
  contents: write
  actions: write

on:
  push:
    branches: [ "run-ci" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # this will call the reusable workflow to build frontend and backend
    uses: ./.github/workflows/build_job.yaml
    with:
      site_url: http://localhost:8080
      run_build: true
      upload_build_artifacts: false
      run_tests: true
      run_lint: true

  remove_run_ci_branch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete run-ci branch
        if: github.event_name == 'push' && github.ref_name == 'run-ci'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method DELETE "repos/$REPO/git/refs/heads/$BRANCH"
